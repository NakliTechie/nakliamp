<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NakliAmp v1 feature gate</title>
<style>#app{position:fixed;left:-10000px;top:0;width:1280px;height:860px;border:0}</style>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<iframe id="app" title="NakliAmp test app"></iframe>
<script type="module">
// v1 feature gate: every v1 row of docs/specs/nakliamp-parity-001.md that a
// browser can check, driven through the real page in an iframe, the way
// test/library-e2e.html drives it.
//
// The music folder is an OPFS directory named `nakliamp-v1-harness`, built
// here from the committed fixtures. Tags the fixtures lack (album, track
// numbers, ReplayGain, embedded lyrics) are written into copies: an ID3v2.4
// tag built by hand for the MP3s (the tag writer does not take ReplayGain or
// lyrics), the app's own tag writer for the FLAC.
//
// Each check runs even when an earlier one failed, so one run lists every
// defect. The gate passes only when every check passes and the page logged no
// console error or unhandled rejection. No timing assertions: waits are
// generous, and only outcomes are checked.

import { readTags } from '../app/library/metadata.mjs';
import { writeTags } from '../app/tags/write.mjs';
import { getTrack as storedTrack, getLoudness, loudnessKey } from '../app/library/store.mjs';
import { candidatesFor } from '../app/ai/playlist.mjs';

const FOLDER = 'nakliamp-v1-harness';
const result = document.querySelector('#result');
const frame = document.querySelector('#app');
const passed = [];
const failed = [];
const notes = {};
const errorsAfterReload = [];
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

async function waitFor(check, message, timeoutMs = 15_000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    const value = await check();
    if (value) return value;
    await sleep(40);
  }
  throw new Error(typeof message === 'function' ? await message() : message);
}

async function check(id, fn) {
  try {
    await fn();
    passed.push(id);
  } catch (error) {
    failed.push(`${id}: ${String(error?.message ?? error).slice(0, 600)}`);
  }
}

// ------------------------------------------------------------- fixtures ----

const enc = new TextEncoder();
const synchsafe = n => [(n >> 21) & 127, (n >> 14) & 127, (n >> 7) & 127, n & 127];
const id3Frame = (id, body) => [...enc.encode(id), ...synchsafe(body.length), 0, 0, ...body];
const textFrame = (id, value) => id3Frame(id, [3, ...enc.encode(value)]);
const txxx = (description, value) => id3Frame('TXXX', [3, ...enc.encode(description), 0, ...enc.encode(value)]);
const uslt = text => id3Frame('USLT', [3, ...enc.encode('eng'), 0, ...enc.encode(text)]);

/** An ID3v2.4 tag in front of the MP3 fixture's audio (its own small tag removed). */
function taggedMp3(audio, frames) {
  const bytes = new Uint8Array(audio);
  let start = 0;
  if (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
    start = 10 + ((bytes[6] << 21) | (bytes[7] << 14) | (bytes[8] << 7) | bytes[9]);
  }
  const body = frames.flat();
  const header = [0x49, 0x44, 0x33, 4, 0, 0, ...synchsafe(body.length)];
  return new Blob([new Uint8Array([...header, ...body]), bytes.subarray(start)], { type: 'audio/mpeg' });
}

function toneWav(seconds, frequency = 440) {
  const rate = 44100;
  const frames = rate * seconds;
  const bytes = new ArrayBuffer(44 + frames * 2);
  const view = new DataView(bytes);
  const ascii = (offset, text) => [...text].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
  ascii(0, 'RIFF'); view.setUint32(4, 36 + frames * 2, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, frames * 2, true);
  for (let i = 0; i < frames; i += 1) {
    view.setInt16(44 + i * 2, Math.round(Math.sin((i / rate) * frequency * 2 * Math.PI) * 9000), true);
  }
  return bytes;
}

async function writeFile(directory, name, data) {
  const handle = await directory.getFileHandle(name, { create: true });
  const writable = await handle.createWritable();
  await writable.write(data);
  await writable.close();
}

async function fixture(name) {
  const response = await fetch(`fixtures/${name}`);
  assert(response.ok, `Fixture ${name} did not load (${response.status}).`);
  return response.arrayBuffer();
}

const LRC_EMBEDDED = '[00:00.00]First line\n[00:00.50]Second line\n';
const LRC_SIDECAR = Array.from({ length: 12 }, (_, i) => `[00:${String(i * 2).padStart(2, '0')}.00]Tone line ${i + 1}`).join('\n');

async function buildFolder() {
  const opfs = await navigator.storage.getDirectory();
  // Delete by name: only this gate's own folder and the tag backups it causes.
  for (const name of [FOLDER, 'nakliamp-tag-backup']) {
    try { await opfs.removeEntry(name, { recursive: true }); } catch { /* not there */ }
  }
  const root = await opfs.getDirectoryHandle(FOLDER, { create: true });
  const mp3 = await fixture('audio-mp3.mp3');
  const flac = await fixture('audio-flac.flac');

  const album = await root.getDirectoryHandle('V1 Album', { create: true });
  const common = [textFrame('TPE1', 'Harness Artist'), textFrame('TALB', 'V1 Album'), textFrame('TCON', 'Ambient'), textFrame('TDRC', '2001')];
  await writeFile(album, '01 Alpha.mp3', taggedMp3(mp3, [
    textFrame('TIT2', 'Alpha'), ...common, textFrame('TRCK', '1/2'),
    txxx('REPLAYGAIN_TRACK_GAIN', '-6.50 dB'), txxx('REPLAYGAIN_TRACK_PEAK', '0.500000'),
    txxx('REPLAYGAIN_ALBUM_GAIN', '-7.00 dB'), txxx('REPLAYGAIN_ALBUM_PEAK', '0.500000'),
    uslt(LRC_EMBEDDED),
  ]));
  await writeFile(album, '02 Beta.mp3', taggedMp3(mp3, [textFrame('TIT2', 'Beta'), ...common, textFrame('TRCK', '2/2')]));
  const canvas = new OffscreenCanvas(16, 16);
  const paint = canvas.getContext('2d');
  paint.fillStyle = '#c84'; paint.fillRect(0, 0, 16, 16);
  await writeFile(album, 'cover.jpg', await canvas.convertToBlob({ type: 'image/jpeg' }));

  const other = await root.getDirectoryHandle('Other', { create: true });
  const gamma = await writeTags(new File([flac], '03 Gamma.flac', { type: 'audio/flac' }), {
    title: 'Gamma', artist: 'Other Artist', album: 'Other Album', genre: 'Rock', year: 1995, trackNo: 3,
  });
  await writeFile(other, '03 Gamma.flac', gamma);
  await writeFile(other, 'Long Tone.wav', toneWav(40, 330));
  await writeFile(other, 'Long Tone.lrc', LRC_SIDECAR);
  await writeFile(other, 'Edit Me.mp3', taggedMp3(mp3, [textFrame('TIT2', 'Before Edit'), textFrame('TPE1', 'Edit Artist')]));
  return root;
}

async function readFolderFile(root, path) {
  const segments = path.split('/');
  const name = segments.pop();
  try {
    let directory = root;
    for (const segment of segments) directory = await directory.getDirectoryHandle(segment);
    return await (await directory.getFileHandle(name)).getFile();
  } catch {
    return null;
  }
}

// ------------------------------------------------------------------ run ----

async function run() {
  const root = await buildFolder();
  const boot = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('NakliAmp iframe boot timed out.')), 20_000);
    frame.addEventListener('load', () => { clearTimeout(timer); resolve(frame.contentWindow); }, { once: true });
  });
  frame.src = '../index.html?harness=1';
  const app = await boot;
  // Errors in the page: the CDP runner installs a guard in every frame; when
  // this page is opened by hand, install one now (boot-time errors then go
  // unseen, which the runner covers).
  notes.pageErrorGuard = app.__errs ? 'runner guard' : 'installed after boot';
  if (!app.__errs) {
    app.__errs = [];
    const original = app.console.error.bind(app.console);
    app.console.error = (...args) => { app.__errs.push(args.map(String).join(' ')); original(...args); };
    app.addEventListener('error', event => app.__errs.push(`error: ${event.message}`));
    app.addEventListener('unhandledrejection', event => app.__errs.push(`rejection: ${event.reason?.stack ?? event.reason}`));
  }
  const harness = await waitFor(() => app.__nakliampHarness, 'NakliAmp harness surface is unavailable.');
  const doc = app.document;
  const $ = selector => doc.querySelector(selector);
  const $$ = selector => [...doc.querySelectorAll(selector)];
  const frameTick = () => new Promise(resolve => app.requestAnimationFrame(() => app.requestAnimationFrame(resolve)));
  const change = (element, value) => { element.value = value; element.dispatchEvent(new app.Event('change', { bubbles: true })); };
  const input = (element, value) => { element.value = value; element.dispatchEvent(new app.Event('input', { bubbles: true })); };
  const key = (k, init = {}) => doc.dispatchEvent(new app.KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...init }));
  const tracks = () => harness.tracks();
  const byTitle = title => tracks().find(track => track.title === title || track.name?.startsWith(title));
  const idOf = title => { const track = byTitle(title); assert(track, `No track titled ${title} in the index.`); return track.id; };
  const pos = () => harness.state().clock.positionS;
  const closeDialogs = async () => { await harness.run('view.close'); await frameTick(); };
  const loadQueue = async (titles, { play = false, startIndex = 0 } = {}) => {
    await harness.run('queue.set', { ids: titles.map(idOf), startIndex, play });
    const want = idOf(titles[startIndex]);
    await waitFor(() => harness.playingId() === want && harness.state().media.duration > 0,
      () => `Queue start did not load ${titles[startIndex]} (playing ${harness.playingId()}, status ${harness.state().status}).`, 20_000);
  };

  // ---- 0. scan --------------------------------------------------------------
  await harness.adoptFolder(root);
  await harness.openLibrary();
  await waitFor(() => harness.libraryTracks() === 5, () => `Scan indexed ${harness.libraryTracks()} of 5 tracks.`, 30_000);

  await check('scan: tags, ReplayGain, lyrics flag, folder art key', () => {
    const alpha = byTitle('Alpha');
    assert(alpha?.album === 'V1 Album' && alpha.trackNo === 1, `Alpha indexed as ${JSON.stringify(alpha)}.`);
    assert(Math.abs(alpha.replayGain?.trackGainDb - -6.5) < 0.01, `Alpha ReplayGain ${JSON.stringify(alpha.replayGain)}.`);
    assert(alpha.hasLyrics, 'Alpha has no lyrics flag.');
    assert(alpha.dirArtKey && !alpha.artKey, `Alpha art keys: artKey ${alpha.artKey}, dirArtKey ${alpha.dirArtKey}.`);
    assert(byTitle('Gamma')?.genre === 'Rock', 'Gamma did not keep the tags the writer gave it.');
  });

  // ---- 1. Library: browse views (L6, L8) -----------------------------------
  $('#lib-tab-browse').click();
  const browseRoot = await waitFor(() => $('#lib-browse .nb'), 'The Browse tab mounted nothing.');
  const viewSelect = browseRoot.querySelector('select[aria-label="Library view"]');
  const summary = () => browseRoot.querySelector('.nb-note').textContent;
  const rowTitles = () => [...browseRoot.querySelectorAll('.nb-window [data-index] .nb-title')].map(node => node.textContent);
  const rowNode = title => [...browseRoot.querySelectorAll('.nb-window [data-index]')].find(node => node.querySelector('.nb-title')?.textContent === title);
  const setBrowse = async view => { change(viewSelect, view); await frameTick(); };

  await check('L6 L8: Browse lists Albums, Artists, Genres, Years, Folders, Recently added, Most played, Favourites', async () => {
    const labels = [...viewSelect.options].map(option => option.textContent);
    for (const label of ['Albums', 'Artists', 'Genres', 'Years', 'Folders', 'Recently added', 'Most played', 'Favourites']) {
      assert(labels.includes(label), `The view list lacks ${label}: ${labels.join(', ')}.`);
    }
    // Albums key on album artist and title, so the two untagged tracks are two groups.
    const expect = { albums: 4, artists: 4, genres: 3, years: 3, folders: 2, recentlyAdded: 5 };
    for (const [view, count] of Object.entries(expect)) {
      await setBrowse(view);
      const shown = browseRoot.querySelectorAll('.nb-window [data-index]').length;
      assert(shown === count, `${view} shows ${shown} rows, expected ${count} (${summary()}).`);
    }
  });

  await check('L6: drill into an album shows its tracks in order', async () => {
    await setBrowse('albums');
    const card = [...browseRoot.querySelectorAll('.nb-card')].find(node => node.textContent.includes('V1 Album'));
    assert(card, 'No V1 Album card.');
    card.click();
    await frameTick();
    assert(JSON.stringify(rowTitles()) === JSON.stringify(['Alpha', 'Beta']), `Drill-in shows ${JSON.stringify(rowTitles())}.`);
    browseRoot.querySelector('.nb-crumb button').click();
    await frameTick();
    assert(browseRoot.querySelectorAll('.nb-card').length === 4, 'Back did not return to the album grid.');
  });

  await check('L7: sort by title, both directions, and by year', async () => {
    await setBrowse('tracks');
    const sortSelect = browseRoot.querySelector('select[aria-label="Sort by"]');
    change(sortSelect, 'title');
    await frameTick();
    const ascending = rowTitles();
    const sorted = [...ascending].sort((a, b) => a.localeCompare(b));
    assert(JSON.stringify(ascending) === JSON.stringify(sorted), `Title sort gave ${JSON.stringify(ascending)}.`);
    browseRoot.querySelector('button[aria-label^="Sort direction"]').click();
    await frameTick();
    assert(JSON.stringify(rowTitles()) === JSON.stringify([...sorted].reverse()), `Descending gave ${JSON.stringify(rowTitles())}.`);
    change(sortSelect, 'year');
    await frameTick();
    const years = rowTitles().map(title => byTitle(title)?.year ?? null).filter(year => year !== null);
    assert(years.length === 3, `Year sort found ${years.length} dated tracks.`);
  });

  await check('Y4: multi-select with Shift and Ctrl click', async () => {
    await setBrowse('tracks');
    const nodes = () => [...browseRoot.querySelectorAll('.nb-window [data-index]')];
    nodes()[0].dispatchEvent(new app.MouseEvent('click', { bubbles: true }));
    nodes()[2].dispatchEvent(new app.MouseEvent('click', { bubbles: true, shiftKey: true }));
    const count = () => browseRoot.querySelector('.nb-count').textContent;
    assert(count() === '3 selected', `Shift click selected "${count()}".`);
    nodes()[4].dispatchEvent(new app.MouseEvent('click', { bubbles: true, ctrlKey: true }));
    assert(count() === '4 selected', `Ctrl click selected "${count()}".`);
    await setBrowse('albums');
  });

  await check('L9: rating and favourite persist to the store', async () => {
    await setBrowse('tracks');
    const gamma = idOf('Gamma');
    rowNode('Gamma').querySelector('[data-rate="4"]').click();
    await waitFor(async () => (await storedTrack(gamma))?.rating === 4, async () => `Stored rating is ${(await storedTrack(gamma))?.rating}.`);
    rowNode('Gamma').querySelector('[data-fav]').click();
    await waitFor(async () => (await storedTrack(gamma))?.bookmarked === 1, async () => `Stored favourite is ${(await storedTrack(gamma))?.bookmarked}.`);
    await setBrowse('favourites');
    assert(JSON.stringify(rowTitles()) === '["Gamma"]', `Favourites shows ${JSON.stringify(rowTitles())}.`);
    await setBrowse('rated');
    assert(JSON.stringify(rowTitles()) === '["Gamma"]', `Rated shows ${JSON.stringify(rowTitles())}.`);
  });

  await check('P5: playing from a list sets the queue to that list', async () => {
    await setBrowse('tracks');
    change(browseRoot.querySelector('select[aria-label="Sort by"]'), 'title');
    await frameTick();
    const order = rowTitles();
    rowNode('Long Tone').dispatchEvent(new app.MouseEvent('dblclick', { bubbles: true }));
    await waitFor(() => harness.playingId() === idOf('Long Tone'), 'Double-clicking Long Tone did not play it.', 20_000);
    const snap = harness.queueSnapshot();
    const titles = snap.ids.map(id => tracks().find(track => track.id === id)?.title);
    assert(JSON.stringify(titles) === JSON.stringify(order), `Queue is ${JSON.stringify(titles)}, list was ${JSON.stringify(order)}.`);
    assert(snap.index === order.indexOf('Long Tone'), `Queue index ${snap.index}.`);
    await waitFor(() => harness.state().clock.playing && pos() > 0.2, 'Long Tone did not start playing.', 20_000);
  });

  // ---- 2. Long Tone: lyrics sidecar, seek keys, Milkdrop, loudness ---------
  await check('T7: .lrc sidecar shows, synced highlight moves', async () => {
    $('#tab-now').click();
    const pane = await waitFor(() => $('#lyrics-root .nk-lyr.synced'), () => `Lyrics pane: ${$('#lyrics-root').textContent.slice(0, 200)}.`, 15_000);
    assert(pane.textContent.includes('Tone line 1'), `Lyrics pane shows ${pane.textContent.slice(0, 200)}.`);
    const activeIndex = () => [...pane.querySelectorAll('li')].findIndex(li => li.getAttribute('aria-current') === 'true');
    const first = activeIndex();
    await harness.seek(5);
    await waitFor(() => activeIndex() > first && activeIndex() >= 2,
      () => `The highlighted line stayed at ${activeIndex()} (was ${first}) at ${pos()} s.`, 10_000);
  });

  await check('V3: Milkdrop runs or refuses by name and falls back', async () => {
    harness.setVisualiserMode('milkdrop');
    await sleep(2500);
    const vis = harness.visualiser();
    const toast = $('#toast').textContent;
    if (vis.mode === 'milkdrop') {
      assert(vis.running, 'Milkdrop is selected but the visualiser is not running.');
      notes.milkdrop = 'ran';
    } else {
      assert(vis.mode === 'none' && /Visualiser stopped/.test(toast), `Milkdrop left mode ${vis.mode}, toast "${toast}".`);
      notes.milkdrop = `refused: ${toast}`;
    }
    harness.setVisualiserMode('bars');
  });

  await check('K3: arrow keys seek 5 s, Shift+arrow 30 s', async () => {
    harness.pause();
    await harness.seek(2);
    await waitFor(() => Math.abs(pos() - 2) < 0.3, `Seek to 2 s left the clock at ${pos()}.`);
    key('ArrowRight');
    await waitFor(() => Math.abs(pos() - 7) < 0.4, () => `ArrowRight from 2 s gave ${pos()}.`);
    key('ArrowRight', { shiftKey: true });
    await waitFor(() => Math.abs(pos() - 37) < 0.4, () => `Shift+ArrowRight from 7 s gave ${pos()}.`);
    key('ArrowLeft');
    await waitFor(() => Math.abs(pos() - 32) < 0.4, () => `ArrowLeft from 37 s gave ${pos()}.`);
    key('ArrowLeft', { shiftKey: true });
    await waitFor(() => Math.abs(pos() - 2) < 0.4, () => `Shift+ArrowLeft from 32 s gave ${pos()}.`);
  });

  await check('S2: loudness measured and stored for one track', async () => {
    harness.pause();
    const id = idOf('Long Tone');
    const value = await harness.measureLoudness(id);
    assert(value && Number.isFinite(value.integratedLufs) && Number.isFinite(value.gainDb), `Measured ${JSON.stringify(value)}.`);
    const stored = await getLoudness(loudnessKey(byTitle('Long Tone')));
    assert(stored && Math.abs(stored.integratedLufs - value.integratedLufs) < 1e-6, `Stored ${JSON.stringify(stored)}.`);
    notes.loudness = { integratedLufs: Number(value.integratedLufs.toFixed(2)), gainDb: Number(value.gainDb.toFixed(2)) };
  });

  // ---- 3. Queue (P5, P6, Y5) ------------------------------------------------
  const queueTitles = () => harness.queueSnapshot().ids.map(id => tracks().find(track => track.id === id)?.title);
  await check('P5 Y5: play next, add, move, remove, undo', async () => {
    await harness.run('queue.set', { ids: ['Alpha', 'Beta', 'Long Tone'].map(idOf), startIndex: 0, play: false });
    await harness.run('queue.play_next', { ids: [idOf('Gamma')] });
    assert(JSON.stringify(queueTitles()) === '["Alpha","Gamma","Beta","Long Tone"]', `After play next: ${JSON.stringify(queueTitles())}.`);
    await harness.run('queue.add', { ids: [idOf('Edit Me')] });
    assert(queueTitles().at(-1) === 'Before Edit', `After add: ${JSON.stringify(queueTitles())}.`);
    await harness.run('queue.move', { from: 1, to: 3 });
    assert(JSON.stringify(queueTitles()) === '["Alpha","Beta","Long Tone","Gamma","Before Edit"]', `After move: ${JSON.stringify(queueTitles())}.`);
    await harness.run('queue.remove', { indices: [4] });
    assert(queueTitles().length === 4, `After remove: ${JSON.stringify(queueTitles())}.`);
    await harness.run('queue.undo');
    assert(queueTitles().length === 5 && queueTitles()[4] === 'Before Edit', `After undo: ${JSON.stringify(queueTitles())}.`);
  });

  await check('P5 Y5: queue panel lists, removes and undoes', async () => {
    $('#tab-queue').click();
    const rows = () => $$('#queue-root [role=option][data-index]');
    await waitFor(() => rows().length === 5, () => `The queue panel shows ${rows().length} rows.`);
    rows()[4].querySelector('[data-remove]').click();
    await waitFor(() => rows().length === 4 && harness.queueSnapshot().length === 4, () => `After the panel remove: ${rows().length} rows.`);
    $('#queue-root button[aria-label="Undo the last queue edit"]').click();
    await waitFor(() => rows().length === 5, () => `Undo left ${rows().length} rows.`);
  });

  await check('P6: shuffle tracks and albums, persisted', async () => {
    const before = queueTitles();
    await harness.run('queue.shuffle', { mode: 'tracks' });
    let snap = harness.queueSnapshot();
    assert(snap.shuffle === 'tracks' && queueTitles()[0] === 'Alpha', `Track shuffle: ${snap.shuffle}, ${JSON.stringify(queueTitles())}.`);
    assert([...queueTitles()].sort().join() === [...before].sort().join(), 'Shuffle lost or added entries.');
    assert(JSON.parse(app.localStorage.getItem('nakliamp:queue') ?? '{}').shuffle === 'tracks' || app.localStorage.getItem('nakliamp:queue')?.includes('tracks'),
      'Shuffle mode is not in the stored queue.');
    await harness.run('queue.shuffle', { mode: 'albums' });
    snap = harness.queueSnapshot();
    const titles = queueTitles();
    assert(snap.shuffle === 'albums', `Album shuffle mode is ${snap.shuffle}.`);
    assert(titles.indexOf('Beta') === titles.indexOf('Alpha') + 1, `Album shuffle split V1 Album: ${JSON.stringify(titles)}.`);
    await harness.run('queue.shuffle', { mode: 'off' });
    assert(JSON.stringify(queueTitles()) === JSON.stringify(before), `Shuffle off did not restore the order: ${JSON.stringify(queueTitles())}.`);
    assert(harness.settings().shuffle === 'off', 'The shuffle setting did not follow.');
  });

  await check('P6: repeat one and all; next and previous follow the queue', async () => {
    await harness.run('queue.repeat', { mode: 'one' });
    assert(harness.queueSnapshot().repeat === 'one' && harness.settings().repeat === 'one', 'Repeat one is not set and saved.');
    await harness.run('queue.repeat', { mode: 'all' });
    await harness.run('queue.set', { ids: ['Gamma', 'Edit Me'].map(idOf), startIndex: 0, play: false });
    await waitFor(() => harness.playingId() === idOf('Gamma'), 'The two-track queue did not load Gamma.', 20_000);
    await harness.run('player.next');
    await waitFor(() => harness.playingId() === idOf('Edit Me'), 'Next did not follow the queue.', 20_000);
    await harness.run('player.next');
    await waitFor(() => harness.playingId() === idOf('Gamma'), 'Next at the end with repeat all did not wrap.', 20_000);
    await harness.run('player.previous');
    await waitFor(() => harness.playingId() === idOf('Edit Me'), 'Previous at the start with repeat all did not wrap.', 20_000);
    await harness.run('queue.repeat', { mode: 'off' });
    harness.pause();
  });

  await check('P5 Y2: save the queue as an M3U8 and add to it', async () => {
    await harness.run('queue.set', { ids: ['Alpha', 'Gamma'].map(idOf), startIndex: 0, play: false });
    await harness.run('queue.save_playlist', { name: 'Harness Queue' });
    const file = await waitFor(() => readFolderFile(root, 'Harness Queue.m3u8'), 'Harness Queue.m3u8 was not written.');
    const text = await file.text();

  // ---- 9. Accessibility and narrow layout (K4, K5) --------------------------
  function labelledByName(element) {
    const labelled = element.getAttribute('aria-labelledby');
    if (!labelled) return '';
    return labelled.split(/\s+/).map(id => doc.getElementById(id)?.textContent ?? '').join(' ').trim();
  }
  function labelName(element) {
    if (!element.labels?.length) return '';
    return [...element.labels].map(label => label.textContent).join(' ').trim();
  }
  function contentName(element) {
    if (element.tagName === 'BUTTON' && element.textContent.trim()) return element.textContent.trim();
    if (element.tagName === 'INPUT' && ['submit', 'button', 'reset'].includes(element.type) && element.value) return element.value;
    return element.getAttribute('title')?.trim() || '';
  }
  function accessibleName(element) {
    return labelledByName(element)
      || element.getAttribute('aria-label')?.trim()
      || labelName(element)
      || contentName(element);
  }
  const unnamed = () => $$('button, input, select, textarea')
    .filter(element => element.type !== 'hidden' && !accessibleName(element))
    .map(element => element.outerHTML.slice(0, 120));

    errorsAfterReload.push(...(frame.contentWindow.__errs ?? []));

}

run().then(({ errors }) => {
  const ok = !failed.length && !errors.length;
  result.dataset.status = ok ? 'pass' : 'fail';
  result.textContent = JSON.stringify({ checks: passed.length + failed.length, passed: passed.length, failed, errors, notes }, null, 2);
  document.title = `${ok ? 'PASS' : 'FAIL'} — NakliAmp v1 feature gate`;
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = JSON.stringify({ aborted: error.stack || String(error), passed: passed.length, failed, notes }, null, 2);
