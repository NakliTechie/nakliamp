<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NakliAmp runner diagnostic fixture</title>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<script>
setTimeout(() => {
  console.error('L7_CONSOLE_SENTINEL');
  fetch('./l7-network-sentinel.bin').catch(() => {});
  // A *successful* request to a third party used to pass every gate: only
  // failures and 4xx/5xx were checked. This one is expected to succeed as far
  // as the page is concerned, and the runner must still report it.
  fetch('https://l7-remote-sentinel.example.com/beacon', { mode: 'no-cors' }).catch(() => {});
  setTimeout(() => {
    const result = document.querySelector('#result');
    result.dataset.status = 'fail';
    result.textContent = 'L7_DECLARED_FAILURE';
    document.title = 'FAIL — NakliAmp runner diagnostic fixture';
  }, 250);
}, 750);
</script>
</body>
</html>
