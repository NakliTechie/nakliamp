<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>NakliAmp analyser gate</title></head>
<body>
<pre id="result" data-status="running">running</pre>
<script type="module">
// Analyser-tap gate.
//
// The visualiser needs sample data from whichever rung is playing. This asserts
// the tap yields real spectrum on the rungs a fixture can reach, that it never
// changes what is heard, and that it reports null rather than lying when a rung
// cannot be tapped.

import { createNakliAmpEngine } from '../engine/nakliamp-engine.mjs';
import { decodePcm, sniffPcm } from '../app/decode/pcm.mjs';

const DECODERS = [{ name: 'in-house PCM', sniff: sniffPcm, decode: decodePcm }];
const result = document.querySelector('#result');
const assert = (condition, message) => { if (!condition) throw new Error(message); };

async function fixture(name) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: fixture request failed (${response.status})`);
  return new File([await response.arrayBuffer()], name);
}

/** Peak magnitude across the spectrum, sampled until it moves or time runs out. */
async function peakEnergy(engine, timeoutMs = 3000) {
  const analyser = engine.analyser();
  if (!analyser) return null;
  const bins = new Uint8Array(analyser.frequencyBinCount);
  const deadline = performance.now() + timeoutMs;
  let peak = 0;
  while (performance.now() < deadline) {
    analyser.getByteFrequencyData(bins);
    for (const value of bins) if (value > peak) peak = value;
    if (peak > 8) return peak;
    await new Promise(resolve => setTimeout(resolve, 40));
  }
  return peak;
}

async function run() {
  const report = {};

  // R1: the engine rung, through the seam Reel exposes.
  {
    const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: DECODERS });
    await engine.load(await fixture('audio-mp3.mp3'));
    assert(engine.state().path === 'r1', 'The MP3 did not load on R1.');
    await engine.play();
    const analyser = engine.analyser();
    assert(analyser, 'R1 exposed no analyser; the Reel seam is missing or unpinned.');
    assert(analyser.frequencyBinCount > 0, 'R1 analyser has no frequency bins.');
    const peak = await peakEnergy(engine);
    assert(peak > 8, `R1 spectrum stayed flat (peak ${peak}).`);
    // The tap is parallel, so playback must be unaffected by reading it.
    assert(engine.state().clock.playing, 'R1 stopped playing once tapped.');
    const before = engine.state().clock.positionS;
    await new Promise(resolve => setTimeout(resolve, 150));
    assert(engine.state().clock.positionS > before, 'R1 clock stalled once tapped.');
    engine.pause();
    report.r1Peak = peak;
  }

  // R3: the software rung, which owns its own graph.
  {
    const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: DECODERS });
    await engine.load(await fixture('audio-pcm.aiff'));
    assert(engine.state().path === 'r3', 'The AIFF did not load on R3.');
    await engine.play();
    const analyser = engine.analyser();
    assert(analyser, 'R3 exposed no analyser.');
    const peak = await peakEnergy(engine);
    assert(peak > 8, `R3 spectrum stayed flat (peak ${peak}).`);
    assert(engine.state().clock.playing, 'R3 stopped playing once tapped.');
    engine.pause();
    report.r3Peak = peak;
  }

  // Asking before anything is loaded must answer null, not throw.
  {
    const engine = createNakliAmpEngine({ version: 'gate' });
    assert(engine.analyser() === null, 'An idle engine returned an analyser.');
  }

  // The same analyser is returned while the rung is unchanged.
  {
    const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: DECODERS });
    await engine.load(await fixture('audio-pcm.aiff'));
    assert(engine.analyser() === engine.analyser(), 'A new analyser was built per call.');
  }

  // Per-channel taps, on each rung, so "Stereo" is drawn from two channels
  // rather than from the bass and treble halves of one summed spectrum.
  //
  // The mono case is the stronger evidence: a genuine discrete split of a
  // one-channel source leaves the second channel silent, which is exactly what
  // a spectrum cut in half could never show.
  for (const [name, rung, channels] of [
    ['audio-vorbis.ogg', 'r1', 2],
    ['audio-pcm.aiff', 'r3', 1],
  ]) {
    const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: DECODERS });
    await engine.load(await fixture(name));
    assert(engine.state().path === rung, `${name} loaded on ${engine.state().path}, expected ${rung}.`);
    assert(engine.state().track.channels === channels,
      `${name} has ${engine.state().track.channels} channels, expected ${channels}.`);
    await engine.play();

    const taps = engine.analysers();
    assert(Array.isArray(taps) && taps.length === 2,
      `${rung}: expected two per-channel analysers, got ${taps?.length}.`);
    assert(taps[0] !== taps[1], `${rung}: both channels are the same node.`);
    assert(taps[0] !== engine.analyser(), `${rung}: a channel tap is the summed tap.`);
    assert(engine.analysers() === taps, `${rung}: new splitter nodes were built per call.`);

    // The fixtures are about a second long, so the peak is accumulated across
    // the whole of playback rather than sampled at one moment.
    const bins = taps.map(node => new Uint8Array(node.frequencyBinCount));
    const peaks = [0, 0];
    const deadline = performance.now() + 2500;
    while (performance.now() < deadline && peaks[0] <= 8) {
      for (const [index, node] of taps.entries()) {
        node.getByteFrequencyData(bins[index]);
        for (const value of bins[index]) if (value > peaks[index]) peaks[index] = value;
      }
      await new Promise(resolve => setTimeout(resolve, 20));
    }

    assert(peaks[0] > 8, `${rung}: the first channel stayed flat (peak ${peaks[0]}).`);
    if (channels === 2) {
      assert(peaks[1] > 8, `${rung}: the second channel stayed flat (peak ${peaks[1]}) for a stereo file.`);
    } else {
      assert(peaks[1] === 0,
        `${rung}: a mono file put ${peaks[1]} into the second channel, so the split is not real.`);
    }
    assert(engine.state().clock.playing || engine.state().clock.positionS > 0,
      `${rung}: splitting the output stopped playback.`);
    engine.pause();
    engine.destroy();
    report[`${rung}Channels`] = peaks;
  }

  return report;
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp analyser gate';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp analyser gate';
});
</script>
</body>
</html>
