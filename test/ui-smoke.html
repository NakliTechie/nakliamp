<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NakliAmp UI smoke</title>
<style>#app{position:fixed;left:-10000px;top:0;width:1024px;height:768px;border:0}</style>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<iframe id="app" title="NakliAmp test app"></iframe>
<script type="module">
const result = document.querySelector('#result');
const frame = document.querySelector('#app');

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function waitFor(check, message, timeoutMs = 10_000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    const value = check();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error(message);
}

async function fixture(name, WindowFile) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: fixture request failed (${response.status})`);
  return new WindowFile([await response.arrayBuffer()], name, { type: response.headers.get('content-type') || '' });
}

async function run() {
  const boot = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('NakliAmp iframe boot timed out.')), 10_000);
    frame.addEventListener('load', () => { clearTimeout(timer); resolve(frame.contentWindow); }, { once: true });
  });
  frame.src = '../index.html?harness=1';
  const app = await boot;
  const harness = await waitFor(() => app.__nakliampHarness, 'NakliAmp harness surface is unavailable.');
  const doc = app.document;

  assert(doc.querySelector('#empty').classList.contains('on'), 'Empty state is not visible at boot.');
  assert(doc.body.textContent.includes('no analytics'), 'Sovereignty copy is missing.');
  assert(doc.querySelector('.version').textContent.includes('0.1.0-m0'), 'Visible version is missing.');

  await harness.open(await fixture('audio-mp3.mp3', app.File));
  assert(doc.querySelector('#player').classList.contains('on'), 'Player state did not open.');
  assert(doc.querySelector('#track-name').textContent === 'audio-mp3', 'Track name did not render.');
  assert(doc.querySelector('#honesty').textContent.includes('AudioDecoder'), 'R1 honesty strip did not render.');
  assert(doc.querySelector('#path-chip').textContent.includes('R1'), 'R1 chip did not render.');
  await harness.play();
  await waitFor(() => harness.state().clock.positionS > 0.12, 'UI playback clock did not advance.');
  harness.pause();

  let refusal = null;
  try {
    await harness.open(await fixture('audio-wma.wma', app.File));
  } catch (error) {
    refusal = error;
  }
  assert(refusal?.code === 'ERR_DEMUX_WMA_REFUSED', `UI refusal code mismatch (${refusal?.code}).`);
  assert(doc.querySelector('#refusal').classList.contains('on'), 'Refusal state did not open.');
  assert(doc.querySelector('#refusal-code').textContent === 'ERR_DEMUX_WMA_REFUSED', 'Refusal code did not render.');
  assert(doc.querySelector('#refusal-message').textContent.includes('WMA'), 'Refusal message omitted WMA.');
  assert(doc.querySelector('#path-chip').textContent.includes('R3'), 'R3 chip did not render.');

  return {
    version: doc.querySelector('.version').textContent,
    path: 'R1',
    refusal: refusal.code,
  };
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp UI smoke';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp UI smoke';
});
</script>
</body>
</html>
