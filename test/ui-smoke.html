<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NakliAmp UI smoke</title>
<style>#app{position:fixed;left:-10000px;top:0;width:1024px;height:768px;border:0}</style>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<iframe id="app" title="NakliAmp test app"></iframe>
<script type="module">
const result = document.querySelector('#result');
const frame = document.querySelector('#app');

function assert(condition, message) {
  if (!condition) throw new Error(message);
}

async function waitFor(check, message, timeoutMs = 10_000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    const value = check();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error(message);
}

async function fixture(name, WindowFile) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: fixture request failed (${response.status})`);
  return new WindowFile([await response.arrayBuffer()], name, { type: response.headers.get('content-type') || '' });
}

async function run() {
  const boot = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('NakliAmp iframe boot timed out.')), 10_000);
    frame.addEventListener('load', () => { clearTimeout(timer); resolve(frame.contentWindow); }, { once: true });
  });
  frame.src = '../index.html?harness=1';
  const app = await boot;
  const harness = await waitFor(() => app.__nakliampHarness, 'NakliAmp harness surface is unavailable.');
  const doc = app.document;

  assert(doc.querySelector('#empty').classList.contains('on'), 'Empty state is not visible at boot.');
  assert(doc.body.textContent.includes('no analytics'), 'Sovereignty copy is missing.');
  assert(doc.querySelector('.version').textContent.includes('0.3.0-m2'), 'Visible version is missing.');

  await harness.open(await fixture('audio-mp3.mp3', app.File));
  assert(!doc.querySelector('#playerbar').hidden, 'The player bar did not appear.');
  assert(doc.querySelector('#track-name').textContent === 'audio-mp3', 'Track name did not render.');
  assert(doc.querySelector('#honesty').textContent.includes('AudioDecoder'), 'R1 honesty strip did not render.');
  assert(doc.querySelector('#path-chip').textContent.includes('R1'), 'R1 chip did not render.');
  await harness.play();
  await waitFor(() => harness.state().clock.positionS > 0.12, 'UI playback clock did not advance.');
  harness.pause();

  // Exercise the real keyboard handler against the browser's range rounding.
  const volume = doc.querySelector('#volume');
  const setVolume = value => {
    volume.value = String(value);
    volume.dispatchEvent(new app.Event('input', { bubbles: true }));
  };
  const volumeKey = key => doc.body.dispatchEvent(new app.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
  const assertVolume = expected => {
    assert(Number(volume.value) === expected, `Slider volume differs from ${expected}.`);
    assert(harness.state().clock.volume === expected, `Engine volume differs from ${expected}.`);
    assert(Number(app.localStorage.getItem('nakliamp:volume')) === expected, `Saved volume differs from ${expected}.`);
  };
  for (const initial of [0.30, 0.31, 0.37]) {
    setVolume(initial);
    for (let pair = 0; pair < 3; pair++) {
      volumeKey('ArrowUp');
      assertVolume(Math.round((initial + 0.05) * 100) / 100);
      volumeKey('ArrowDown');
      assertVolume(initial);
    }
  }
  setVolume(0.98); volumeKey('ArrowUp'); assertVolume(1);
  setVolume(0.02); volumeKey('ArrowDown'); assertVolume(0);
  setVolume(0.8);

  let refusal = null;
  try {
    await harness.open(await fixture('audio-wma.wma', app.File));
  } catch (error) {
    refusal = error;
  }
  assert(refusal?.code === 'ERR_DEMUX_WMA_REFUSED', `UI refusal code mismatch (${refusal?.code}).`);
  assert(!doc.querySelector('#refusal').hidden, 'The refusal banner did not appear.');
  assert(doc.querySelector('#refusal-code').textContent === 'ERR_DEMUX_WMA_REFUSED', 'Refusal code did not render.');
  assert(doc.querySelector('#refusal-message').textContent.includes('WMA'), 'Refusal message omitted WMA.');
  assert(doc.querySelector('#pb-title'), 'The player bar lost its title.');

  // The visualiser: every mode must render against real playback without
  // throwing, and switching modes must not leave a frame callback running.
  {
    const vis = harness.visualiser();
    assert(vis.modes >= 12, `only ${vis.modes} visualiser modes registered`);
    assert(doc.querySelector('#vis'), 'The visualiser canvas is missing.');
    assert(!doc.querySelector('#vis-wrap').hidden, 'The visualiser is hidden by default.');

    await harness.open(await fixture('audio-mp3.mp3', app.File));
    await harness.play();
    for (const { id } of [...doc.querySelector('#vis-mode').options].map(option => ({ id: option.value }))) {
      // Each mode needs a playing fixture; the one-second clip can end mid-loop.
      await harness.seek(0);
      await harness.play();
      harness.setVisualiserMode(id);
      await new Promise(resolve => setTimeout(resolve, 45));
      const state = harness.visualiser();
      assert(state.mode === id, `mode ${id} did not apply (got ${state.mode})`);
      assert(
        id === 'none' ? !state.running : state.running,
        `mode ${id} running state is wrong (${state.running})`,
      );
    }
    harness.setVisualiserMode('bars');
    assert(harness.toggleFullVisualiser() === true, 'Full window did not engage.');
    assert(doc.querySelector('#vis-wrap').classList.contains('full'), 'Full window class missing.');
    assert(harness.toggleFullVisualiser() === false, 'Full window did not release.');
    harness.pause();
  }

  // The library screen, which the rest of this harness never reaches. A folder
  // grant needs a user gesture that headless cannot give, so this asserts the
  // screen opens, explains itself, and throws nothing on the way.
  await harness.openLibrary();
  assert(doc.querySelector('#library').classList.contains('on'), 'The library view did not open.');
  assert(doc.querySelector('#lib-list').children.length > 0, 'The library rendered no rows and no explanation.');
  assert(
    doc.querySelector('#lib-list').textContent.trim().length > 0,
    'The empty library said nothing about what to do next.',
  );
  assert(harness.libraryTracks() === 0, 'The harness library was unexpectedly populated.');
  assert(harness.playlists() === 0, 'The harness library reported playlists it does not have.');
  assert(doc.querySelector('#lib-playlist'), 'The playlist control is missing.');
  assert(doc.querySelector('#lib-playlist').hidden, 'The playlist control shows with no playlists.');
  assert(doc.querySelector('#lib-reopen').hidden, 'The reopen button shows with no remembered folder.');
  assert(!doc.querySelector('#lib-open').hidden, 'The library empty state offers no way to open a folder.');
  assert(doc.querySelector('#lib-save'), 'The save-as-playlist control is missing.');

  doc.querySelector('#lib-search').value = 'nothing matches this';
  doc.querySelector('#lib-search').dispatchEvent(new app.Event('input'));
  await new Promise(resolve => setTimeout(resolve, 60));
  assert(doc.querySelector('#library').classList.contains('on'), 'Searching closed the library.');

  // The library and the player coexist now: playing must not close the library.
  assert(doc.querySelector('#library').classList.contains('on'), 'The library closed itself.');

  return {
    version: doc.querySelector('.version').textContent,
    path: 'R1',
    refusal: refusal.code,
  };
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp UI smoke';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp UI smoke';
});
</script>
</body>
</html>
