<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>NakliAmp wasm decode gate</title></head>
<body>
<pre id="result" data-status="running">running</pre>
<script type="module">
// R3 wasm tier: the formats no browser decodes.
//
// Holds two claims at once. The wasm tier decodes WMA and WavPack, and the
// lean build still refuses both by name — a build's decoders are a property of
// that build, and shipping the heavy one must not quietly change the light one.

import { createNakliAmpEngine } from '../engine/nakliamp-engine.mjs';
import { decodePcm, sniffPcm } from '../app/decode/pcm.mjs';
import { libavDecoder, decodeLibav, libavInstance, streamLibav } from '../app/decode/libav.mjs';
import { whenStreamsClosed, openStreamCount } from '../app/decode/libav-stream.mjs';
import { makeLongDsf } from './pending-dsd-make.mjs';

const PCM = { name: 'in-house PCM', sniff: sniffPcm, decode: decodePcm };
const result = document.querySelector('#result');
const assert = (c, m) => { if (!c) throw new Error(m); };

async function fixture(name) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: ${response.status}`);
  return new File([await response.arrayBuffer()], name);
}

// The DSD fixture is one second; ALAC two; Musepack lands near three; the rest five.
const DURATION_FLOOR = { dsd: 0.5, alac: 1.5, musepack: 3 };

async function checkFullBuild(name, container, mime) {
  // No browser decodes these; if one starts, this gate is testing nothing.
  assert(!document.createElement('audio').canPlayType(mime), `${name}: this browser now plays ${mime}.`);

  const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: [PCM, libavDecoder] });
  const loaded = await engine.load(await fixture(name));
  const state = engine.state();

  // ALAC is the one exception: Chromium's WebCodecs decodes it (observed in
  // Chrome 2026-11-16), so it rightly stays on the engine rung there. The
  // wasm rung is what carries it where WebCodecs does not (Firefox).
  const allowed = container === 'alac' ? ['r1', 'r3'] : ['r3'];
  assert(allowed.includes(loaded.path), `${name} loaded on ${loaded.path}, expected ${allowed.join(' or ')}.`);
  if (loaded.path === 'r3') {
    assert(state.honesty.decode.includes('libav'), `${name}: strip hid the wasm tier: ${state.honesty.decode}`);
  }
  const floor = DURATION_FLOOR[container] ?? 4;
  assert(state.media.duration > floor,
    `${name}: decoded ${state.media.duration}s, expected over ${floor}.`);
  assert(state.track.sampleRate > 20000, `${name}: rate ${state.track.sampleRate}.`);

  await engine.play();
  await new Promise(r => setTimeout(r, 150));
  assert(engine.state().clock.playing, `${name}: not playing.`);
  assert(engine.state().clock.positionS > 0, `${name}: clock did not advance.`);
  engine.pause();
  // Gives the R3 graph and any decode stream back, so later cases start clean.
  engine.destroy();
  return { path: loaded.path, seconds: +state.media.duration.toFixed(2) };
}

async function checkLeanBuild(name) {
  let refusal = null;
  const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: [PCM] });
  try { await engine.load(await fixture(name)); } catch (error) { refusal = error; }
  assert(refusal, `${name}: the lean build played a format it has no decoder for.`);
  assert(refusal.code, `${name}: refusal carried no code.`);
  return refusal.code;
}

// Two decodes of the same container at once must not share a scratch file.
//
// MEMFS is one flat namespace and the name was fixed per container, so a
// second decode overwrote the first one's bytes mid-demux. The engine's
// supersede logic does not help: it cancels the caller, not the decode
// already running inside wasm.
async function checkConcurrentDecodes(report) {
  const good = new Uint8Array(await (await fixture('audio-wmav2.wma')).arrayBuffer());
  // Same signature, no usable stream: it fails, and it fails *while* the
  // valid one is being read.
  const broken = new Uint8Array(4096);
  broken.set(good.subarray(0, 64));

  const [first, second] = await Promise.allSettled([
    libavDecoder.decode(good),
    libavDecoder.decode(broken),
  ]);
  assert(first.status === 'fulfilled',
    `A concurrent decode of the same container broke the valid one: ${first.reason?.message}`);
  assert(first.value.frames > 1000, `The valid concurrent decode returned ${first.value?.frames} frames.`);
  assert(second.status === 'rejected', 'A file with no readable stream decoded.');
  assert(second.reason?.name === 'LibavDecodeError', `Unnamed concurrent failure: ${second.reason?.name}`);
  report.concurrentFrames = first.value.frames;
}

// A second stream must not end the read early.
//
// The read loop once stopped at the first batch with no packets for the
// audio stream. With cover art that is the very first batch, so the track
// came back empty or cut short. A one-byte batch budget puts the cover-art
// packet alone in the first batch, which is that case exactly.
async function checkSecondStream(report) {
  const plain = await decodeLibav(new Uint8Array(await (await fixture('audio-alac.m4a')).arrayBuffer()));
  const cover = new Uint8Array(await (await fixture('audio-alac-cover.m4a')).arrayBuffer());
  for (const readLimit of [1, 4096]) {
    const decoded = await decodeLibav(cover, { readLimit });
    assert(decoded.frames === plain.frames,
      `The cover-art ALAC decoded ${decoded.frames} frames at a ${readLimit}-byte batch; the plain one ${plain.frames}.`);
  }
  report.secondStreamFrames = plain.frames;
}

// Repeated failures must not leak wasm handles.
//
// The decoder context, packet, frame and demuxer were freed only on the
// success path, so every refused file left four handles inside the wasm heap
// for the life of the tab. The heap's allocated byte count must return to
// its baseline after a run of refused and successful decodes, and the tier
// must still work afterwards.
async function checkHeapAfterFailures(report) {
  const instance = await libavInstance();
  const broken = new Uint8Array(4096);
  broken.set([0x30, 0x26, 0xb2, 0x75, 0x8e, 0x66, 0xcf, 0x11]);
  const wma = new Uint8Array(await (await fixture('audio-wmav2.wma')).arrayBuffer());
  try { await libavDecoder.decode(broken); } catch { /* warm the failure path */ }
  await libavDecoder.decode(wma);
  const baseline = await instance.mallinfo_uordblks();
  let refusals = 0;
  for (let round = 0; round < 25; round += 1) {
    try { await libavDecoder.decode(broken); } catch { refusals += 1; }
  }
  assert(refusals === 25, `${25 - refusals} malformed files decoded without error.`);
  const after = await libavDecoder.decode(wma);
  assert(after.frames > 1000, `The tier decoded ${after.frames} frames after 25 failures.`);
  const heldAfter = await instance.mallinfo_uordblks();
  assert(heldAfter === baseline, `The wasm heap holds ${heldAfter - baseline} bytes more after 26 decodes.`);
  report.afterFailures = after.frames;
  report.heapDeltaBytes = heldAfter - baseline;
}

// A file too large to hold several times over is refused by name.
//
// The size is checked before anything is read or allocated, so the guard is
// exercised with a stand-in that reports a length rather than a quarter of a
// gigabyte of real memory the gate would then have to hold.
async function checkTooLarge(report) {
  const enormous = { length: 300 * 1024 * 1024 };
  for (const [index, byte] of [0x30, 0x26, 0xb2, 0x75, 0x8e, 0x66, 0xcf, 0x11].entries()) enormous[index] = byte;
  let refusal = null;
  try { await libavDecoder.decode(enormous); } catch (error) { refusal = error; }
  assert(refusal, 'A 300 MB file was accepted for whole-file decode.');
  assert(refusal.code === 'ERR_NAKLIAMP_LIBAV_TOO_LARGE', `Unexpected refusal ${refusal.code}.`);
  assert(refusal.message.includes('300'), `The refusal did not say how large: ${refusal.message}`);
  report.tooLarge = refusal.code;
}

// A five-minute DSD64 stereo track plays, streamed.
//
// Whole-file decode of this file would hold about 212 MB in and about 850 MB
// of Float32 out at 352.8 kHz. Streamed, it is read a slice at a time and
// resampled inside libav to the context rate. The file is built here from the
// one-second fixture (DSD compresses nothing, so a real one would weigh
// 212 MB in the repository). The case asserts playback starts, the clock
// advances, a seek near the end lands, the track plays to its end, the JS
// heap grows by under 64 MB while it plays, and the wasm heap returns to
// its baseline after destroy.
async function checkStreamedDsd(report) {
  const mono = new Uint8Array(await (await fixture('audio-dsd.dsf')).arrayBuffer());
  const long = makeLongDsf(mono, 300);
  const file = new File(long.parts, 'long-dsd64.dsf');
  const instance = await libavInstance();
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  // Warm the stereo decoder and resampler once: their static tables are not a per-track leak.
  const warm = await streamLibav(file, { container: 'dsd', outputRate: 48000 });
  await warm.read();
  await warm.close();
  await whenStreamsClosed();
  const heapBaseline = await instance.mallinfo_uordblks();
  const jsHeap = () => performance.memory?.usedJSHeapSize ?? null;
  const jsBaseline = jsHeap();
  let jsPeak = jsBaseline;
  const sampler = setInterval(() => { const now = jsHeap(); if (now > jsPeak) jsPeak = now; }, 50);

  const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: [PCM, libavDecoder] });
  try {
    const loaded = await engine.load(file);
    assert(loaded.path === 'r3', `The long DSD loaded on ${loaded.path}.`);
    assert(Math.abs(loaded.duration - long.seconds) < 0.001, `Duration ${loaded.duration}, expected ${long.seconds}.`);
    const state = engine.state();
    assert(state.honesty.decode.includes('software decode, streamed'), `Strip: ${state.honesty.decode}`);
    assert(state.track.sampleRate <= 96000, `Output at ${state.track.sampleRate} Hz, not resampled.`);

    await engine.play();
    await sleep(400);
    let clock = engine.state().clock;
    assert(clock.playing, 'The long DSD is not playing.');
    assert(clock.positionS > 0.1 && clock.positionS < 5, `Clock at ${clock.positionS} after 400 ms.`);
    const advancedFrom = clock.positionS;
    await sleep(300);
    assert(engine.state().clock.positionS > advancedFrom, 'The clock did not advance.');

    const target = long.seconds - 2.5;
    await engine.seek(target);
    await sleep(300);
    clock = engine.state().clock;
    assert(clock.playing && clock.positionS > target && clock.positionS < target + 1.5,
      `After a seek to ${target.toFixed(2)} the clock is at ${clock.positionS} (playing ${clock.playing}).`);

    // The tail plays out and the track ends on its own.
    const deadline = performance.now() + 8000;
    while (engine.state().clock.playing && performance.now() < deadline) await sleep(100);
    clock = engine.state().clock;
    assert(!clock.playing, 'The long DSD did not end.');
    assert(Math.abs(clock.positionS - long.seconds) < 0.01, `Ended at ${clock.positionS}, expected ${long.seconds}.`);
  } finally {
    clearInterval(sampler);
    engine.destroy();
  }
  await whenStreamsClosed();
  const heapAfter = await instance.mallinfo_uordblks();
  assert(openStreamCount() === 0, `${openStreamCount()} decode streams still open.`);
  assert(heapAfter === heapBaseline, `The wasm heap holds ${heapAfter - heapBaseline} bytes more after destroy.`);
  const growthMb = jsBaseline === null ? null : (jsPeak - jsBaseline) / 1024 / 1024;
  assert(growthMb === null || growthMb < 64, `The JS heap grew by ${growthMb?.toFixed(1)} MB while streaming.`);
  report.streamedDsd = {
    fileMb: +(file.size / 1024 / 1024).toFixed(1),
    seconds: +long.seconds.toFixed(3),
    jsHeapPeakGrowthMb: growthMb === null ? 'performance.memory unavailable' : +growthMb.toFixed(1),
    wasmHeapDeltaBytes: heapAfter - heapBaseline,
  };
}

async function run() {
  const report = {};

  const CASES = [
    ['audio-wmav2.wma', 'wma', 'audio/x-ms-wma'],
    ['audio-wavpack.wv', 'wavpack', 'audio/wavpack'],
    ['audio-ape.ape', 'ape', 'audio/x-ape'],
    ['audio-musepack.mpc', 'musepack', 'audio/x-musepack'],
    ['audio-tta.tta', 'tta', 'audio/x-tta'],
    ['audio-dsd.dsf', 'dsd', 'audio/x-dsd'],
    ['audio-alac.m4a', 'alac', 'audio/mp4; codecs="alac"'],
  ];
  for (const [name, container, mime] of CASES) report[container] = await checkFullBuild(name, container, mime);

  // The lean build refuses both, by name, and does not retry them.
  for (const [name] of CASES) report[`lean:${name}`] = await checkLeanBuild(name);

  await checkConcurrentDecodes(report);

  await checkSecondStream(report);

  await checkHeapAfterFailures(report);

  await checkTooLarge(report);

  await checkStreamedDsd(report);

  return report;
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp wasm decode gate';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp wasm decode gate';
});
</script>
</body>
</html>
