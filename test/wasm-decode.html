<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>NakliAmp wasm decode gate</title></head>
<body>
<pre id="result" data-status="running">running</pre>
<script type="module">
// R3 wasm tier: the formats no browser decodes.
//
// Holds two claims at once. The wasm tier decodes WMA and WavPack, and the
// lean build still refuses both by name — a build's decoders are a property of
// that build, and shipping the heavy one must not quietly change the light one.

import { createNakliAmpEngine } from '../engine/nakliamp-engine.mjs';
import { decodePcm, sniffPcm } from '../app/decode/pcm.mjs';
import { libavDecoder } from '../app/decode/libav.mjs';

const PCM = { name: 'in-house PCM', sniff: sniffPcm, decode: decodePcm };
const result = document.querySelector('#result');
const assert = (c, m) => { if (!c) throw new Error(m); };

async function fixture(name) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: ${response.status}`);
  return new File([await response.arrayBuffer()], name);
}

// The DSD fixture is one second; ALAC two; Musepack lands near three; the rest five.
const DURATION_FLOOR = { dsd: 0.5, alac: 1.5, musepack: 3 };

async function checkFullBuild(name, container, mime) {
  // No browser decodes these; if one starts, this gate is testing nothing.
  assert(!document.createElement('audio').canPlayType(mime), `${name}: this browser now plays ${mime}.`);

  const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: [PCM, libavDecoder] });
  const loaded = await engine.load(await fixture(name));
  const state = engine.state();

  // ALAC is the one exception: Chromium's WebCodecs decodes it (observed in
  // Chrome 2026-11-16), so it rightly stays on the engine rung there. The
  // wasm rung is what carries it where WebCodecs does not (Firefox).
  const allowed = container === 'alac' ? ['r1', 'r3'] : ['r3'];
  assert(allowed.includes(loaded.path), `${name} loaded on ${loaded.path}, expected ${allowed.join(' or ')}.`);
  if (loaded.path === 'r3') {
    assert(state.honesty.decode.includes('libav'), `${name}: strip hid the wasm tier: ${state.honesty.decode}`);
  }
  const floor = DURATION_FLOOR[container] ?? 4;
  assert(state.media.duration > floor,
    `${name}: decoded ${state.media.duration}s, expected over ${floor}.`);
  assert(state.track.sampleRate > 20000, `${name}: rate ${state.track.sampleRate}.`);

  await engine.play();
  await new Promise(r => setTimeout(r, 150));
  assert(engine.state().clock.playing, `${name}: not playing.`);
  assert(engine.state().clock.positionS > 0, `${name}: clock did not advance.`);
  engine.pause();
  return { path: loaded.path, seconds: +state.media.duration.toFixed(2) };
}

async function checkLeanBuild(name) {
  let refusal = null;
  const engine = createNakliAmpEngine({ version: 'gate', softwareDecoders: [PCM] });
  try { await engine.load(await fixture(name)); } catch (error) { refusal = error; }
  assert(refusal, `${name}: the lean build played a format it has no decoder for.`);
  assert(refusal.code, `${name}: refusal carried no code.`);
  return refusal.code;
}

async function run() {
  const report = {};

  const CASES = [
    ['audio-wmav2.wma', 'wma', 'audio/x-ms-wma'],
    ['audio-wavpack.wv', 'wavpack', 'audio/wavpack'],
    ['audio-ape.ape', 'ape', 'audio/x-ape'],
    ['audio-musepack.mpc', 'musepack', 'audio/x-musepack'],
    ['audio-tta.tta', 'tta', 'audio/x-tta'],
    ['audio-dsd.dsf', 'dsd', 'audio/x-dsd'],
    ['audio-alac.m4a', 'alac', 'audio/mp4; codecs="alac"'],
  ];
  for (const [name, container, mime] of CASES) report[container] = await checkFullBuild(name, container, mime);

  // The lean build refuses both, by name, and does not retry them.
  for (const [name] of CASES) report[`lean:${name}`] = await checkLeanBuild(name);

  // Two decodes of the same container at once must not share a scratch file.
  //
  // MEMFS is one flat namespace and the name was fixed per container, so a
  // second decode overwrote the first one's bytes mid-demux. The engine's
  // supersede logic does not help: it cancels the caller, not the decode
  // already running inside wasm.
  {
    const good = new Uint8Array(await (await fixture('audio-wmav2.wma')).arrayBuffer());
    // Same signature, no usable stream: it fails, and it fails *while* the
    // valid one is being read.
    const broken = new Uint8Array(4096);
    broken.set(good.subarray(0, 64));

    const [first, second] = await Promise.allSettled([
      libavDecoder.decode(good),
      libavDecoder.decode(broken),
    ]);
    assert(first.status === 'fulfilled',
      `A concurrent decode of the same container broke the valid one: ${first.reason?.message}`);
    assert(first.value.frames > 1000, `The valid concurrent decode returned ${first.value?.frames} frames.`);
    assert(second.status === 'rejected', 'A file with no readable stream decoded.');
    assert(second.reason?.name === 'LibavDecodeError', `Unnamed concurrent failure: ${second.reason?.name}`);
    report.concurrentFrames = first.value.frames;
  }

  // Repeated failures must not exhaust the module.
  //
  // The decoder context, packet, frame and demuxer were freed only on the
  // success path, so every refused file left four handles inside the wasm heap
  // for the life of the tab. This is a soak rather than a direct count: the
  // handles are not observable from outside, so what is asserted is that the
  // tier still works after a run of failures.
  {
    const broken = new Uint8Array(4096);
    broken.set([0x30, 0x26, 0xb2, 0x75, 0x8e, 0x66, 0xcf, 0x11]);
    let refusals = 0;
    for (let round = 0; round < 25; round += 1) {
      try { await libavDecoder.decode(broken); } catch { refusals += 1; }
    }
    assert(refusals === 25, `${25 - refusals} malformed files decoded without error.`);
    const after = await libavDecoder.decode(new Uint8Array(await (await fixture('audio-wmav2.wma')).arrayBuffer()));
    assert(after.frames > 1000, `The tier decoded ${after.frames} frames after 25 failures.`);
    report.afterFailures = after.frames;
  }

  // A file too large to hold several times over is refused by name.
  //
  // The size is checked before anything is read or allocated, so the guard is
  // exercised with a stand-in that reports a length rather than a quarter of a
  // gigabyte of real memory the gate would then have to hold.
  {
    const enormous = { length: 300 * 1024 * 1024 };
    for (const [index, byte] of [0x30, 0x26, 0xb2, 0x75, 0x8e, 0x66, 0xcf, 0x11].entries()) enormous[index] = byte;
    let refusal = null;
    try { await libavDecoder.decode(enormous); } catch (error) { refusal = error; }
    assert(refusal, 'A 300 MB file was accepted for whole-file decode.');
    assert(refusal.code === 'ERR_NAKLIAMP_LIBAV_TOO_LARGE', `Unexpected refusal ${refusal.code}.`);
    assert(refusal.message.includes('300'), `The refusal did not say how large: ${refusal.message}`);
    report.tooLarge = refusal.code;
  }

  return report;
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp wasm decode gate';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp wasm decode gate';
});
</script>
</body>
</html>
