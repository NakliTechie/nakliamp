<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NakliAmp library end-to-end gate</title>
<style>#app{position:fixed;left:-10000px;top:0;width:1280px;height:860px;border:0}</style>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<iframe id="app" title="NakliAmp test app"></iframe>
<script type="module">
// Library end-to-end gate: attach a folder, scan it, click a track, hear it.
//
// This is the journey most people take and it was the one thing never tested.
// A real folder grant needs a user gesture no harness can give, so the folder
// is an **OPFS directory**: `navigator.storage.getDirectory()` returns a real
// FileSystemDirectoryHandle with no prompt, and every line of app code after
// that point is the same one a granted folder runs.
//
// It drives the real page in an iframe, not the modules, because the failure
// being guarded against is wiring: the modules all passed their own gates while
// the app around them could still have been broken.

const result = document.querySelector('#result');
const frame = document.querySelector('#app');
const assert = (condition, message) => { if (!condition) throw new Error(message); };

async function waitFor(check, message, timeoutMs = 15_000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    // The check may be async: reading a file back off disk is how the playlist
    // assertions observe what the app actually wrote.
    const value = await check();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 40));
  }
  // A failing wait should say what it saw, not just that it waited.
  throw new Error(typeof message === 'function' ? await message() : message);
}

/**
 * A playable WAV of `seconds` at 8 kHz mono, built here rather than committed.
 * The audio fixtures are all about one second, which is too short to observe
 * anything real-time: a sample taken 200 ms later lands after the track ended.
 * Every timing assertion below needs a file that outlasts the assertion.
 */
function toneWav(seconds, frequency = 440) {
  // 44.1 kHz deliberately. An 8 kHz WAV loads and then sits at position zero,
  // so the rate has to match what real music actually uses.
  const rate = 44100;
  const frames = rate * seconds;
  const bytes = new ArrayBuffer(44 + frames * 2);
  const view = new DataView(bytes);
  const ascii = (offset, text) => [...text].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
  ascii(0, 'RIFF'); view.setUint32(4, 36 + frames * 2, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, frames * 2, true);
  for (let i = 0; i < frames; i += 1) {
    view.setInt16(44 + i * 2, Math.round(Math.sin((i / rate) * frequency * 2 * Math.PI) * 12000), true);
  }
  return bytes;
}

/** Build a small album in OPFS, wiping anything a previous run left. */
async function buildFolder() {
  const root = await navigator.storage.getDirectory();
  for await (const [name] of root.entries()) {
    try { await root.removeEntry(name, { recursive: true }); } catch { /* nothing to remove */ }
  }
  const album = await root.getDirectoryHandle('Gate Album', { create: true });
  const written = [];
  for (const [name, seconds, frequency] of [
    ['01 First.wav', 6, 440], ['02 Second.wav', 6, 660], ['03 Third.wav', 6, 880],
  ]) {
    const handle = await album.getFileHandle(name, { create: true });
    const writable = await handle.createWritable();
    await writable.write(toneWav(seconds, frequency));
    await writable.close();
    written.push(`Gate Album/${name}`);
  }
  // A nested folder, so the walk is exercised beyond one level.
  const live = await album.getDirectoryHandle('Bonus', { create: true });
  const bonus = await live.getFileHandle('04 Nested.wav', { create: true });
  const writable = await bonus.createWritable();
  await writable.write(toneWav(6, 220));
  await writable.close();
  written.push('Gate Album/Bonus/04 Nested.wav');

  // A playlist in its own subfolder, holding the three kinds of entry an edit
  // used to destroy: a remote stream, a file the index has never seen, and
  // tracks that live outside the playlist's own directory.
  const lists = await root.getDirectoryHandle('Lists', { create: true });
  const playlist = await lists.getFileHandle(PLAYLIST_NAME, { create: true });
  const writer = await playlist.createWritable();
  await writer.write(PLAYLIST_SOURCE);
  await writer.close();

  return { root, written };
}

const PLAYLIST_NAME = 'Gate Mix.m3u8';
const PLAYLIST_PATH = `Lists/${PLAYLIST_NAME}`;
const PLAYLIST_SOURCE = [
  '#EXTM3U',
  '#PLAYLIST:Gate Mix',
  '#EXTINF:-1,Somewhere Else',
  'https://example.invalid/stream.aac',
  '#EXTINF:6,First',
  '../Gate Album/01 First.wav',
  '#EXTINF:-1,Never Scanned',
  '../Gate Album/missing.wav',
  '#EXTINF:6,Nested',
  '../Gate Album/Bonus/04 Nested.wav',
  '#EXTINF:6,Third',
  '../Gate Album/03 Third.wav',
  '',
].join('\n');

/** Read a file out of the OPFS folder, or null when it is not there. */
async function readFile(root, path) {
  const segments = path.split('/');
  const name = segments.pop();
  try {
    let directory = root;
    for (const segment of segments) directory = await directory.getDirectoryHandle(segment);
    return await (await (await directory.getFileHandle(name)).getFile()).text();
  } catch {
    return null;
  }
}

async function run() {
  const { root, written } = await buildFolder();

  const boot = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('NakliAmp iframe boot timed out.')), 15_000);
    frame.addEventListener('load', () => { clearTimeout(timer); resolve(frame.contentWindow); }, { once: true });
  });
  frame.src = '../index.html?harness=1';
  const app = await boot;
  const harness = await waitFor(() => app.__nakliampHarness, 'NakliAmp harness surface is unavailable.');
  const doc = app.document;

  // 1. Attach the folder and scan it.
  await harness.adoptFolder(root);
  await harness.openLibrary();
  await waitFor(() => harness.libraryTracks() === written.length,
    `Scan indexed ${harness.libraryTracks()} of ${written.length} tracks.`);

  const rows = () => [...doc.querySelectorAll('.lib-row')];
  // A double click plays a row; a single click only selects it, the same rule as
  // Browse (UX review M4, 2026-11-17). Before that change a single click played.
  const playRow = row => row.dispatchEvent(new app.MouseEvent('dblclick', { bubbles: true, cancelable: true, detail: 2 }));
  await waitFor(() => rows().length === written.length, 'The library did not list every track.');
  assert(harness.view() === 'library', `After scanning the view is ${harness.view()}.`);

  // The nested file must be found, and its path kept relative to the root.
  assert(
    doc.querySelector('#lib-list').textContent.includes('Bonus/04 Nested.wav'),
    'The scan missed the nested folder.',
  );

  // 2. Double-click a track the way a person does, and hear it.
  playRow(rows()[0]);
  await waitFor(() => harness.state().path, 'Clicking a library row loaded nothing.');
  await waitFor(
    () => harness.state().clock.positionS > 0.2,
    () => {
      const state = harness.state();
      const scanLine = doc.querySelector('#lib-scan').textContent.trim();
      return 'Playback did not start from the library. '
        + JSON.stringify({ path: state.path, status: state.status, playing: state.clock.playing,
            pos: state.clock.positionS, dur: state.media.duration, name: state.media.name,
            error: state.error?.code ?? null, scanLine });
    },
  );

  const playing = harness.state();
  assert(playing.clock.playing, 'The player did not report playing.');
  assert(playing.media.duration > 4, `Duration was ${playing.media.duration}; the fixture should be 6s.`);

  // 3. The UX-02 invariant: playing must not take you out of what you were browsing.
  assert(harness.view() === 'library', `Playing switched the view to ${harness.view()}.`);
  assert(!doc.querySelector('#playerbar').hidden, 'The player bar stayed hidden while playing.');
  assert(doc.querySelector('#pb-title').textContent.length > 0, 'The player bar shows no track.');

  // 4a. A cold first run must be audible.
  //
  // It was not. `localStorage.getItem` returns null when unset, `Number(null)`
  // is 0, and 0 passed the 0..1 range check — so every first-time user got a
  // silent player. Nothing caught it because every other gate measured the
  // clock, which advances perfectly well at zero gain.
  assert(
    app.localStorage.getItem('nakliamp:volume') === null,
    'This run is not cold: a stored volume would mask the first-run default.',
  );
  const volumeSlider = doc.querySelector('#volume');
  assert(Number(volumeSlider.value) > 0,
    `Cold start volume is ${volumeSlider.value}; a first run must not be silent.`);
  assert(harness.state().clock.volume > 0,
    `The engine is at volume ${harness.state().clock.volume} on a cold start.`);

  // And the signal actually reaches the tap.
  const peak = await waitFor(() => {
    const value = harness.spectrumPeak();
    return typeof value === 'number' && value > 8 ? value : false;
  }, () => `The spectrum stayed silent (peak ${harness.spectrumPeak()}) at volume ${harness.state().clock.volume}.`, 6000);
  assert(peak > 8, `Spectrum peak was ${peak}.`);

  // 4b. The visualiser is running and the canvas is sized.
  assert(harness.visualiser().running, 'The visualiser is not running during playback.');
  const canvas = doc.querySelector('#vis');
  assert(canvas.width > 20 && canvas.height > 10,
    `The visualiser canvas is ${canvas.width}x${canvas.height}; it is not being sized.`);

  // 5. Next and previous move through the queue.
  const first = harness.state().media.name;
  doc.querySelector('#next').click();
  await waitFor(() => harness.state().media.name !== first, 'Next did not change track.');
  const second = harness.state().media.name;
  doc.querySelector('#prev').click();
  await waitFor(() => harness.state().media.name === first, 'Previous did not return to the first track.');

  // 6. Where you stopped is remembered.
  await waitFor(() => harness.state().clock.positionS > 1.0, 'The clock did not advance before the resume check.');
  harness.pause();
  doc.querySelector('#next').click();
  await waitFor(() => harness.state().media.name === second, 'Could not move on to check resume.');
  doc.querySelector('#prev').click();
  await waitFor(() => harness.state().media.name === first, 'Could not return to check resume.');
  // Bounded on purpose. Given long enough, a track restarted from zero passes
  // any position threshold, so an open-ended wait here proved nothing.
  await waitFor(() => harness.state().clock.positionS > 0.9,
    () => `Returning to a track restarted it: it is at ${harness.state().clock.positionS}.`, 700);

  // 6b. And when the switch is a click in the list rather than Next.
  //     Only auto-advance used to record the outgoing position, so clicking
  //     straight from one track to another lost where the first one was.
  await harness.play();
  // Well past anything an earlier step stored, so a stale resume position
  // cannot pass for a fresh one.
  await waitFor(() => harness.state().clock.positionS > 3.0, 'The clock did not advance before the click check.', 20_000);
  const leftAt = harness.state().clock.positionS;
  playRow(rows()[1]);
  await waitFor(() => harness.state().media.name === second, 'Clicking the second row did not switch track.');
  playRow(rows()[0]);
  await waitFor(() => harness.state().media.name === first, 'Clicking the first row did not switch back.');
  // A short window on purpose: a track restarted from zero cannot reach this
  // position within it, so only a real resume can satisfy the wait. Given long
  // enough, ordinary playback would satisfy any threshold and prove nothing.
  await waitFor(() => harness.state().clock.positionS > leftAt - 0.6,
    () => `Clicking away lost the position: resumed at ${harness.state().clock.positionS}, left at ${leftAt}.`,
    900);
  harness.pause();

  // 7. Search narrows the list without losing playback, and without touching
  //    the queue. Since v1 the queue is its own model (parity P5): a search
  //    changes the rows on screen, never what plays next. (Before v1 the queue
  //    was the visible rows, and this step asserted the index went to -1.)
  const playingName = harness.state().media.name;
  const search = doc.querySelector('#lib-search');
  search.value = 'Nested';
  search.dispatchEvent(new app.Event('input'));
  await waitFor(() => rows().length === 1, () => `Search matched ${rows().length} rows, expected 1.`);
  assert(harness.state().path, 'Searching stopped playback.');
  const queueBefore = harness.queue();
  assert(queueBefore.length === written.length && queueBefore.index >= 0,
    `Searching changed the queue: ${JSON.stringify(queueBefore)}.`);
  assert(doc.querySelector('.lib-row[aria-current]') === null,
    'A row that is not the playing track is marked as playing.');
  // Next and previous still follow the queue, whatever the list shows.
  await waitFor(() => !doc.querySelector('#next').disabled || !doc.querySelector('#prev').disabled,
    'Next and previous were disabled by a search, but the queue still has the playing track.');

  search.value = '';
  search.dispatchEvent(new app.Event('input'));
  await waitFor(() => rows().length === written.length, 'Clearing the search did not restore the list.');
  assert(harness.state().media.name === playingName, 'Searching changed the playing track.');
  const marked = doc.querySelector('.lib-row[aria-current] b')?.textContent ?? null;
  assert(marked && playingName.includes(marked.replace(/\.wav$/, '')),
    `The now-playing marker is on ${marked} while ${playingName} plays.`);

  // 7b. The last track of a queue must stop writing when it ends.
  //
  // `advancing` prevented two advances overlapping, not the same one
  // repeating: `advance` awaited an IndexedDB write before discovering there
  // was no next track, so a finished last track wrote to the database on every
  // animation frame for as long as the tab stayed open.
  playRow(rows().at(-1));
  await waitFor(() => harness.state().clock.playing && harness.state().media.duration > 4,
    'The last track did not start.');
  await waitFor(() => harness.queue().index === harness.queue().length - 1,
    () => `Expected to be on the last track, index is ${harness.queue().index}.`);
  await harness.seek(harness.state().media.duration - 0.3);
  await waitFor(() => harness.state().clock.positionS >= harness.state().media.duration - 0.05,
    () => `The last track did not reach its end (at ${harness.state().clock.positionS}).`);

  const writesAtEnd = harness.positionWrites();
  await new Promise(resolve => setTimeout(resolve, 900));
  const writesLater = harness.positionWrites();
  assert(writesLater - writesAtEnd <= 1,
    `A finished last track wrote its position ${writesLater - writesAtEnd} times in 900ms.`);
  assert(!harness.visualiser().running, 'The visualiser kept painting after the track ended.');

  // 8. Editing a playlist must not delete anything from the user's file.
  //
  // Every edit rewrites the whole file. The write path used to keep only the
  // entries that matched the index, so a single click erased the remote
  // stream and the not-yet-scanned file from disk. The row buttons also
  // carried their position in the *rendered* list, so with a search active
  // they acted on a different track than the one clicked.
  const playlistReport = await editPlaylist(app, doc, harness, root, rows, waitFor);

  // 8b. The keyboard map answers to the keys the README documents.
  //
  //     The table shows `M`, `N / P` and `L`; only the lowercase keys were
  //     bound, so holding shift did nothing it promised. `Shift+V` stays a
  //     binding of its own.
  {
    // M, P and N are sent as capital letters without Shift (Caps Lock), which the
    // command keymap maps to the plain letter. Since v1 Shift+M is the mini player,
    // so a real Shift+M is not pressed here.
    const press = (key, init = {}) => doc.dispatchEvent(new app.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...init }));
    const before = harness.state().clock.muted;
    press('M');
    await waitFor(() => harness.state().clock.muted !== before, 'Shift+M did not mute.');
    press('m');
    await waitFor(() => harness.state().clock.muted === before, 'm did not unmute.');

    const track = harness.state().media.name;
    press('P');
    await waitFor(() => harness.state().media.name !== track, 'Shift+P did not move to the previous track.');
    press('N');
    await waitFor(() => harness.state().media.name === track, 'Shift+N did not move back.');

    // Shift+V is the full-window visualiser, not a second binding for `v`.
    const mode = harness.visualiser().mode;
    press('V', { shiftKey: true });
    assert(harness.visualiser().mode === mode, 'Shift+V changed the visualiser mode instead of going full window.');
    await waitFor(() => doc.querySelector('#vis-wrap').classList.contains('full'), 'Shift+V did not open the full-window visualiser.');
    press('Escape');
    await waitFor(() => !doc.querySelector('#vis-wrap').classList.contains('full'), 'Escape did not leave the full-window visualiser.');
  }

  // 9. A drop anywhere in the window is handled, not navigated to.
  //
  // The handlers were bound to the empty-state panel, which is hidden the
  // moment a library exists — so for everyone past their first run a dropped
  // file did what an unhandled drop does: the browser navigated the tab to it
  // and the player went with it. The README says "drag it onto the window".
  const dropped = new app.File([toneWav(3, 330)], 'Dropped Tune.wav', { type: 'audio/wav' });
  const transfer = new app.DataTransfer();
  transfer.items.add(dropped);

  const dragover = new app.DragEvent('dragover', { dataTransfer: transfer, bubbles: true, cancelable: true });
  doc.body.dispatchEvent(dragover);
  assert(dragover.defaultPrevented, 'dragover was not prevented, so no drop event would ever fire.');

  const dropEvent = new app.DragEvent('drop', { dataTransfer: transfer, bubbles: true, cancelable: true });
  doc.body.dispatchEvent(dropEvent);
  assert(dropEvent.defaultPrevented,
    'A drop on the window was left to the browser, which navigates the tab away from the player.');
  await waitFor(() => harness.state().media.name === 'Dropped Tune.wav',
    () => `The dropped file did not open; the player is on ${harness.state().media.name}.`);

  harness.pause();
  return {
    ...playlistReport,
    indexed: harness.libraryTracks(),
    nested: true,
    viewWhilePlaying: harness.view(),
    queue: harness.queue(),
    spectrumPeak: peak,
    coldVolume: Number(doc.querySelector('#volume').value),
  };
}

async function editPlaylist(app, doc, harness, root, rows, waitFor) {
  const select = doc.querySelector('#lib-playlist');
  assert([...select.options].some(option => option.value === PLAYLIST_PATH),
    `The scan did not pick up ${PLAYLIST_PATH}.`);

  const before = harness.playlistEntries(PLAYLIST_PATH);
  assert(before?.length === 5, `The playlist parsed to ${before?.length} entries, expected 5.`);
  assert(before.filter(entry => entry.path === null).length === 1,
    'The remote entry should be the only unresolvable one.');

  select.value = PLAYLIST_PATH;
  select.dispatchEvent(new app.Event('change'));
  // Three of the five entries name a file the index actually has.
  await waitFor(() => rows().length === 3, () => `The playlist listed ${rows().length} rows, expected 3.`);

  // Narrow to one row that is *not* the first, then remove it. With the old
  // ordinal the handler would remove the playlist's first playable track.
  const search = doc.querySelector('#lib-search');
  search.value = 'Third';
  search.dispatchEvent(new app.Event('input'));
  await waitFor(() => rows().length === 1, () => `Search matched ${rows().length} rows, expected 1.`);
  doc.querySelector('.row-tools button[data-action="remove"]').click();

  await waitFor(async () => (await readFile(root, PLAYLIST_PATH))?.includes('03 Third.wav') === false,
    async () => 'Removing the searched row did not rewrite the file without that track. '
      + JSON.stringify({ scanLine: doc.querySelector('#lib-scan').textContent.trim(),
          file: await readFile(root, PLAYLIST_PATH) }), 20_000);
  const afterRemove = await readFile(root, PLAYLIST_PATH);

  assert(afterRemove.includes('01 First.wav'),
    `The remove acted on the wrong row — the first track is gone:\n${afterRemove}`);
  assert(afterRemove.includes('https://example.invalid/stream.aac'),
    `The remote entry was deleted from the file:\n${afterRemove}`);
  assert(afterRemove.includes('missing.wav'),
    `The unscanned entry was deleted from the file:\n${afterRemove}`);
  assert(afterRemove.includes('../Gate Album/'),
    `Tracks outside the playlist directory lost their climb:\n${afterRemove}`);

  search.value = '';
  search.dispatchEvent(new app.Event('input'));

  // A rename whose sanitised file name is unchanged must not delete the file.
  // `Mix` and `Mix ` both produce `Mix.m3u8`; writing then deleting removed
  // what had just been written.
  const prompted = [];
  app.prompt = message => { prompted.push(message); return prompted.length === 1 ? 'Gate Mix ' : 'Café Mix'; };
  app.confirm = () => true;

  doc.querySelector('#lib-rename').click();
  await waitFor(async () => (await readFile(root, PLAYLIST_PATH)) !== afterRemove,
    'The same-name rename did not rewrite the file.', 20_000);
  assert(await readFile(root, PLAYLIST_PATH) !== null,
    'A rename that changed no file name deleted the playlist.');

  // A rename that does change the file name moves it, and moves everything.
  select.value = PLAYLIST_PATH;
  select.dispatchEvent(new app.Event('change'));
  await waitFor(() => rows().length === 2, () => `Expected 2 rows before the rename, saw ${rows().length}.`);
  doc.querySelector('#lib-rename').click();

  const renamedPath = 'Lists/Café Mix.m3u8';
  const renamed = await waitFor(async () => await readFile(root, renamedPath),
    'The rename did not produce the new file.', 20_000);
  assert(await readFile(root, PLAYLIST_PATH) === null, 'The old playlist file was left behind.');
  for (const needle of ['https://example.invalid/stream.aac', 'missing.wav', '01 First.wav', '04 Nested.wav']) {
    assert(renamed.includes(needle), `The rename lost ${needle}:\n${renamed}`);
  }
  assert(renamed.includes('#PLAYLIST:Café Mix'), `The renamed playlist kept the old name:\n${renamed}`);

  return { playlistEntriesKept: renamed.split('\n').filter(line => line && !line.startsWith('#')).length };
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp library end-to-end gate';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp library end-to-end gate';
});
</script>
</body>
</html>
