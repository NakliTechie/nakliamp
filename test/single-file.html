<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NakliAmp single-file release gate</title>
<style>#app{position:fixed;left:-10000px;top:0;width:1024px;height:768px;border:0}</style>
</head>
<body>
<pre id="result" data-status="running">running</pre>
<iframe id="app" title="NakliAmp single-file release"></iframe>
<script type="module">
// Single-file release gate.
//
// Runs over BOTH artifacts, and drives them **through the DOM alone**.
//
// It used to hardcode the lean one, which is how a full build that threw on
// its first line shipped past three green gates: the static checks read the
// file without running it, and the wasm-decode gate exercised the decoder from
// source on a page carrying no CSP at all.
//
// It also used to reach for `__nakliampHarness`, which meant the artifact under
// test carried a seam no released player should have, booted with
// `restoreSession` suppressed, and was therefore not the file anyone would
// download. The seam is cut at build time now, so what is left is what ships:
// a drop on the window, the transport, and what the page says about itself.

const result = document.querySelector('#result');
const frame = document.querySelector('#app');
const assert = (condition, message) => { if (!condition) throw new Error(message); };

async function waitFor(check, message, timeoutMs = 15_000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    const value = check();
    if (value) return value;
    await new Promise(resolve => setTimeout(resolve, 20));
  }
  throw new Error(typeof message === 'function' ? message() : message);
}

async function fixture(name, WindowFile) {
  const response = await fetch(`./fixtures/${name}`);
  assert(response.ok, `${name}: fixture request failed (${response.status})`);
  return new WindowFile([await response.arrayBuffer()], name);
}

const ARTIFACTS = [
  { file: 'nakliamp.html', full: false },
  { file: 'nakliamp-full.html', full: true },
];

async function boot(file) {
  const ready = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error(`${file} did not boot.`)), 20_000);
    frame.addEventListener('load', () => { clearTimeout(timer); resolve(frame.contentWindow); }, { once: true });
  });
  // No query string: this is the URL a person opens.
  frame.src = `../dist/${file}`;
  const app = await ready;
  // The boot marker proves the modules instantiated. Static HTML renders
  // whether or not a single line of script ran.
  await waitFor(() => app.document.documentElement.dataset.nakliampReady === '1',
    `${file} rendered but never ran: no boot marker.`);
  assert(app.__nakliampHarness === undefined, `${file} ships the gate seam.`);
  return { app, doc: app.document };
}

/** Open a file the way a person does: drop it on the window. */
function dropFile(app, doc, file) {
  const transfer = new app.DataTransfer();
  transfer.items.add(file);
  const event = new app.DragEvent('drop', { dataTransfer: transfer, bubbles: true, cancelable: true });
  doc.body.dispatchEvent(event);
  assert(event.defaultPrevented, 'The artifact left the drop to the browser, which navigates the tab away.');
}

/** The elapsed clock as seconds, read off the transport the way a person reads it. */
function elapsed(doc) {
  const [minutes, seconds] = doc.querySelector('#elapsed').textContent.split(':').map(Number);
  return Number.isFinite(minutes) && Number.isFinite(seconds) ? minutes * 60 + seconds : 0;
}

async function run() {
  const report = {};

  for (const { file, full } of ARTIFACTS) {
    const { app, doc } = await boot(file);

    assert(doc.querySelector('#empty').classList.contains('on'), `${file}: empty state not visible.`);
    assert(doc.body.textContent.includes('no analytics'), `${file}: sovereignty copy missing.`);
    assert(
      doc.querySelector('#mediabunny-licence')?.textContent.includes('Mozilla Public License'),
      `${file}: does not carry the Mediabunny licence.`,
    );

    dropFile(app, doc, await fixture('audio-mp3.mp3', app.File));
    await waitFor(() => doc.querySelector('#pb-title').textContent.includes('audio-mp3'),
      () => `${file}: the dropped MP3 never reached the player bar.`);
    assert(!doc.querySelector('#playerbar').hidden, `${file}: the player bar stayed hidden.`);
    await waitFor(() => elapsed(doc) >= 1,
      () => `${file}: the transport clock did not advance (${doc.querySelector('#elapsed').textContent}).`,
      8_000);
    doc.querySelector('#play').click();
    report[full ? 'fullMp3' : 'leanMp3'] = doc.querySelector('#pb-sub').textContent;

    // The claim each artifact makes about the wasm tier, held to the artifact.
    dropFile(app, doc, await fixture('audio-wmav2.wma', app.File));
    if (full) {
      await waitFor(() => doc.querySelector('#pb-title').textContent.includes('audio-wmav2'),
        () => `${file}: WMA never reached the player bar. Refusal: `
          + `${doc.querySelector('#refusal-code').textContent}`);
      assert(doc.querySelector('#refusal').hidden, `${file}: WMA was refused by the full build.`);
      // Only the wasm tier can decode this, so a moving clock proves it ran.
      const started = elapsed(doc);
      await waitFor(() => elapsed(doc) > started,
        () => `${file}: WMA loaded but never played.`, 8_000);
      doc.querySelector('#play').click();
      report.fullWma = doc.querySelector('#pb-sub').textContent;
    } else {
      await waitFor(() => !doc.querySelector('#refusal').hidden,
        () => `${file}: the lean build played WMA, which it has no decoder for.`);
      const code = doc.querySelector('#refusal-code').textContent;
      assert(code.startsWith('ERR_'), `${file}: WMA refusal carried no code (${code}).`);
      report.leanWma = code;
    }
  }

  return report;
}

run().then(report => {
  result.dataset.status = 'pass';
  result.textContent = JSON.stringify(report, null, 2);
  document.title = 'PASS — NakliAmp single-file release gate';
}).catch(error => {
  result.dataset.status = 'fail';
  result.textContent = error.stack || String(error);
  document.title = 'FAIL — NakliAmp single-file release gate';
});
</script>
</body>
</html>
